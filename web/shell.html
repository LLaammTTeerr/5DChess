<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5DChess</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23D97757'/%3E%3Cpath d='M0 0h16v16H0zM16 16h16v16H16z' fill='%23FAF9F5' opacity='.35'/%3E%3C/svg%3E">
<style>
  :root { --bg:#FAF9F5; --fg:#2B2A27; --muted:#6B685F; --accent:#D97757; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; gap:10px; }
  h1 { margin:4px 0 0; font-size:1.6rem; color:var(--accent); letter-spacing:.02em; }
  #status { color:var(--muted); font-size:.9rem; min-height:1.2em; }
  #wrap { width:min(100%, calc((100vh - 140px) * 1400 / 800), 1400px); aspect-ratio:1400/800;
    background:var(--bg); border:1px solid #E4E1D6; border-radius:8px; overflow:hidden; }
  canvas#canvas { display:block; width:100%; height:100%; outline:none; }
  progress { width:min(100%,320px); accent-color:var(--accent); }
  footer { color:var(--muted); font-size:.85rem; text-align:center; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>5DChess</h1>
  <div id="status">Downloading...</div>
  <progress id="progress" value="0" max="100" hidden></progress>
  <div id="wrap"><canvas id="canvas" width="1400" height="800" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
  <footer>Multidimensional chess with timeline mechanics &middot;
    <a href="https://github.com/LLaammTTeerr/5DChess">Source on GitHub</a></footer>
</main>
<script>
  var statusEl = document.getElementById('status');
  var progressEl = document.getElementById('progress');
  var Module = {
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    canvas: (function () {
      var c = document.getElementById('canvas');
      c.addEventListener('webglcontextlost', function (e) { alert('WebGL context lost. Reload the page.'); e.preventDefault(); }, false);
      return c;
    })(),
    setStatus: function (text) {
      if (text === Module.setStatus.last) return;
      Module.setStatus.last = text;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        progressEl.value = parseInt(m[2]) * 100; progressEl.max = parseInt(m[4]) * 100; progressEl.hidden = false;
        statusEl.textContent = 'Loading...';
      } else {
        progressEl.hidden = true;
        statusEl.textContent = text ? 'Loading...' : '';
      }
    },
    monitorRunDependencies: function (left) {
      if (left === 0) statusEl.textContent = '';
    }
  };
  // Runtime errors go to the console; only fatal load failures are shown on the page.
  window.onerror = function (msg) {
    console.error(msg);
    if (/abort|failed to load|failed to fetch|out of memory/i.test(String(msg)))
      statusEl.textContent = 'Error: ' + msg;
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
