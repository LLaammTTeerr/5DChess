name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Engine tests (ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No leftover merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ':!*.png'; then
            echo "::error::merge-conflict markers found"; exit 1
          fi
      - name: Cache FetchContent downloads
        uses: actions/cache@v6
        with:
          path: build-test/_deps
          key: fetchcontent-test-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
      - name: Configure
        run: cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Debug -DFDCHESS_BUILD_GAME=OFF -DFDCHESS_SANITIZE=ON
      - name: Build
        run: cmake --build build-test -j
      - name: Test
        run: ctest --test-dir build-test --output-on-failure

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install raylib dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Cache FetchContent downloads
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFDCHESS_BUILD_GAME=ON -DFDCHESS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  ui:
    name: UI screenshots (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
            libgl1-mesa-dri libasound2-dev xvfb xauth python3-pil
      - name: Cache FetchContent downloads
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-ui-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFDCHESS_BUILD_TOOLS=ON -DFDCHESS_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --target ui_script -j 4
      - name: Run UI scripts and compare with tests/ui/baseline
        run: tests/ui/run.sh
      - name: Upload screenshots and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-diff
          path: |
            ui-out/diff
            ui-out/run
            ui-out/*.log

  web:
    name: Build (WebAssembly)
    runs-on: ubuntu-latest
    container: emscripten/emsdk:4.0.10
    steps:
      - uses: actions/checkout@v7
      - name: Install a recent CMake (the image ships 3.22; the project needs 3.28)
        run: pip install --quiet cmake
      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DFDCHESS_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-web -j 4
      - name: Stage site
        run: |
          mkdir site
          cp build-web/5dchess.js build-web/5dchess.wasm build-web/5dchess.data site/
          cp build-web/5dchess.html site/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: 5dchess-web
          path: site
