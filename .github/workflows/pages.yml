name: Deploy web build to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (WebAssembly)
    runs-on: ubuntu-latest
    container: emscripten/emsdk:4.0.10 # keep in sync with ci.yml
    steps:
      - uses: actions/checkout@v4
      - name: Install a recent CMake (the image ships 3.22; the project needs 3.28)
        run: pip install --quiet cmake
      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DFDCHESS_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-web -j 4
      - name: Stage site
        run: |
          mkdir site
          cp build-web/5dchess.js build-web/5dchess.wasm build-web/5dchess.data site/
          cp build-web/5dchess.html site/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
