name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches project VERSION
        id: check
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 -oP '^\s*VERSION\s+\K[0-9]+(\.[0-9]+)*' CMakeLists.txt)
          echo "tag=$tag cmake=$ver"
          if [ -z "$ver" ] || [ "$tag" != "$ver" ]; then
            echo "::error::Tag v$tag does not match CMakeLists.txt VERSION '$ver'"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Check CHANGELOG has a section for this version
        run: scripts/changelog_section.sh "${{ steps.check.outputs.version }}" > /dev/null

  build:
    name: Package (${{ matrix.name }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, name: linux }
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    steps:
      - uses: actions/checkout@v7
      - name: Install raylib dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFDCHESS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          cmake --build build --config Release --target package
          cd build
          zips=(5DChess-*.zip)
          [ ${#zips[@]} -eq 1 ] || { echo "::error::expected exactly one zip, got: ${zips[*]}"; exit 1; }
          mv "${zips[0]}" "5DChess-${{ needs.verify-tag.outputs.version }}-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: 5DChess-${{ matrix.name }}
          path: build/5DChess-${{ needs.verify-tag.outputs.version }}-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG
        run: |
          {
            scripts/changelog_section.sh "${{ needs.verify-tag.outputs.version }}"
            echo
            echo "**▶ Play in your browser:** https://chess.lamter.cc/ · **⬇ Downloads** below (Linux, macOS, Windows)."
          } > release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -l dist
      # body_path is the CHANGELOG section; generate_release_notes appends GitHub's list of merged PRs below it
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*.zip
